<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Fundamentos de Telemática · Tema 1 · Presentación interactiva</title>
  <link rel="stylesheet" href="./slides.css">
</head>
<body>
  <a class="skip-link" href="#deck-stage">Saltar a la diapositiva</a>

  <header class="viewer-bar" aria-label="Controles de presentación">
    <a class="viewer-home" href="../">Tema 1 · interactivos</a>
    <div class="viewer-status" aria-live="polite">
      <span id="slide-counter">1 / 67</span>
      <span id="slide-title">Diapositiva 1</span>
    </div>
    <div class="viewer-actions">
      <button id="overview-toggle" type="button" class="viewer-button" aria-pressed="false">Índice</button>
      <button id="fullscreen-button" type="button" class="viewer-button">Pantalla completa</button>
    </div>
  </header>

  <main id="deck-stage" class="deck-stage" tabindex="-1">
    <section id="slide-frame" class="slide-frame" aria-label="Diapositiva actual"></section>
  </main>

  <aside id="overview-panel" class="overview-panel" aria-label="Índice de diapositivas" hidden>
    <div class="overview-card">
      <div class="overview-head">
        <div>
          <h1>Índice</h1>
          <p>Selecciona una miniatura o usa las flechas del teclado.</p>
        </div>
        <button id="overview-close" type="button" class="viewer-button">Cerrar</button>
      </div>
      <nav id="overview-list" class="overview-list" aria-label="Miniaturas"></nav>
    </div>
  </aside>

  <aside id="debug-panel" class="debug-panel" hidden aria-label="Diagnóstico de overlays"></aside>

  <footer class="viewer-controls" aria-label="Navegación de diapositivas">
    <button id="prev-slide" type="button" class="nav-button">Anterior</button>
    <div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
    <button id="next-slide" type="button" class="nav-button">Siguiente</button>
  </footer>

  <script src="./polls-config.js"></script>
  <script src="./interactions-config.js"></script>
  <script src="./slides.js"></script>
</body>
</html>
